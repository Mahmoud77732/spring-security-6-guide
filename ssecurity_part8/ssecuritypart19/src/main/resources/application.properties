# ${varName : defaultValue}  -> environment variable
spring.application.name= ${SPRING_APP_NAME:securitypart1}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/springsecurity_db?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.format_sql = true
spring.jpa.hibernate.show_sql = true
spring.jpa.hibernate.ddl-auto = update

spring.config.import = application_prod.properties

# default | prod
spring.profiles.active = default

server.servlet.session.timeout = ${SESSION_TIMEOUT:20m}

logging.level.org.springframework.security.web.FilterChainProxy = debug

###
# * Custom Filters in Spring Security
#
# * Servlets & Filters:
#   - Servlets are Java classes that handle requests and responses in a web application.
#   - Filters are used to intercept requests and responses, allowing for pre-processing and post-processing.
#
# * Spring Security Internal Flow:
# [user entered credentials] <--> [Servlet] 
#    <--> [ [Spring Security Filters] -> [Authentication] & [Security Context] ]
#    <--> [Authentication Manager] 
#    <--> [ [Authentication Provider] -> [Password Encoder] & [UserDetails Manager/Service] ]
#
