# ${varName : defaultValue}  -> environment variable
spring.application.name= ${SPRING_APP_NAME:ssecurity_method_level_security_21}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/springsecurity_db?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.format_sql = true
spring.jpa.hibernate.show_sql = true
spring.jpa.hibernate.ddl-auto = update

spring.config.import = application_prod.properties

# default | prod
spring.profiles.active = default

server.servlet.session.timeout = ${SESSION_TIMEOUT:20m}

logging.level.org.springframework.security.web.FilterChainProxy = debug

###
# * Method Level Security :-
#   - This is a sample configuration for method level security in Spring Security.
#   - It demonstrates how to secure methods using annotations like @PreAuthorize.
#   - to enbale it you need to add @EnableMethodSecurity in your configuration class. 
#   - Method Leve Security provides 2 approaches: 
#       - Invocation Security: validates is someone can call the method ot not based on their roles/authorities
#       - Filtering authorization: validates what a method can recieve or return based on their roles/authorities
# * Annotations used:
#   - @PreAuthorize (before): used to specify a condition that must be true for the method
#       to be executed. It can check for roles, authorities, or any SpEL expression
#   - @PostAuthorize (after): used to check the condition after the method execution.
#   - @Secured: used to specify a list of roles that are allowed to access the method.
#   - @RolesAllowed: similar to @Secured, but part of the JSR-250 standard.
#   - @PreFilter: used to filter the input arguments before the method execution based on a condition.
#   - @PostFilter: used to filter the output after the method execution based on a condition.
#
# * Example:
#   - @PreAuthorize("hasRole('ADMIN')") - only users with ADMIN role can execute the method.
#   - @PostAuthorize("returnObject.username == authentication.name") - checks if the returned object
#       has the same username as the authenticated user.
#   - @Secured({"ROLE_USER", "ROLE_ADMIN"}) - allows access to users with either USER or ADMIN role.
#   - @RolesAllowed("ROLE_MANAGER") - allows access to users with MANAGER role
#   - @PreFilter("filterObject.startsWith('A')") - filters input arguments
#       to only include those that start with 'A'.
#   - @PostFilter("filterObject.username == authentication.name") - filters output
#       to only include those that match the authenticated user's username.
#
# * Note (1):
#   - Method Level Security is more granular than URL-based security.
#   - It allows for fine-grained control over method access based on user roles and conditions.
#   - It is useful for securing business logic methods in service layers.
#   - It can be combined with URL-based security for comprehensive security coverage.
#   - Method Level Security is not a replacement for URL-based security:
#       it complements it by adding an additional layer of security at the method level.
#   - It is important to use Method Level Security judiciously to avoid performance overhead.
#
# * Note (2):
#   - @Secured & @RoleAllowed are less {flexible & powerful} than @PreAuthorize and @PostAuthorize.
#   - therse are 2 methods to enable Method-Level-Security @EnableMethodSecurity & @EnableGlobalMethodSecurity.
#
# * Note (3):
#   - @EnableMethodSecurity() has many params:
#       - securedEnabled: enables @Secured annotation.
#       - jsr250Enabled: enables @RolesAllowed annotation.
#       - prePostEnabled: enables @PreAuthorize and @PostAuthorize annotations.
#       - proxyTargetClass: enables CGLIB proxying for method security.
#       - mode: specifies the mode of method security (default is AspectJ).
#       - order: specifies the order of method security in the filter chain.
#
