# ${varName : defaultValue}  -> environment variable
spring.application.name= ${SPRING_APP_NAME:securitypart1}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/springsecurity_db?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.format_sql = true
spring.jpa.hibernate.show_sql = true
spring.jpa.hibernate.ddl-auto = update

spring.config.import = application_prod.properties

# default | prod
spring.profiles.active = default

server.servlet.session.timeout = ${SESSION_TIMEOUT:20m}

###
# ? Session Fixation, Session Hijaking Attacks
# ? Session Fixation:
#   - The attacker sets or predicts a session ID and tricks the victim into using it (e.g., by sending a link with JSESSIONID).
#   - Once the victim logs in using that session, the attacker has access since they already know the session ID.
#   - 1 solution by spring security
#       ```
#        http
#           .sessionManagement()
#           .sessionFixation().migrateSession(); // default behavior
#        ```
#   - migrateSession() invalidates the old session and creates a new one after login
#   * by default the Spring Security framework is going to use the changeSessionId strategy
# ? Session Hijacking:
#   - The attacker steals a valid session ID (e.g., via XSS, network sniffing).
#   - Then uses it to impersonate the user.
#   - solutions by spring security
#       "server.ssl.enabled: true",
#       "server.servlet.session.timeout=15m",
#       Limit concurrent sessions,
#       Secure & HttpOnly cookies
###


