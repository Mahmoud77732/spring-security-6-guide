# ? CORS & CSRF
# * CORS: Cross-Origin Resource Sharing -&&- CSRF: Cross-Site Request Forgery
# * CORS allows restricted resources on a web page to be requested from another 
# *     domain outside the domain from which the first resource was served.
# * CSRF is a type of attack that tricks the user into submitting a request that they didn't intend to make.
# * CSRF attacks are mitigated by using anti-CSRF tokens, which are unique and secret values that are sent with each request.
# * CORS is configured to allow requests from specific origins, while CSRF protection is enabled by default in Spring Security.
