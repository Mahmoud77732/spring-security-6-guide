#
# (2) in security-config-class: 
#   - change "http.sessionManagement()" that is responsiple on creating JSESSIONIDfrom from "ALWAYS" to "STATELESS"
#   - no need for "http.securityContext()" because we are not using session
#   - in CORS config: use "config.setExposedHeaders(Arrays.asList("Authorization"))" to expose the JWT token in the response header
#
# (3) create "JWTTokenGeneratorFilter" class in "filter" package
#
# (4) create "JWTTokenValidatorFilter" class in "filter" package
#
# (5) in security-config-class:
#   - add "http.addFilterAfter(new JWTTokenGeneratorFilter(), BasicAuthenticationFilter.class
#       - this will add the filter after the BasicAuthenticationFilter to generate the JWT token
#   - add "http.addFilterBefore(new JWTTokenValidatorFilter(), BasicAuthenticationFilter.class)"
#       - this will add the filter before the BasicAuthenticationFilter to validate the JWT token
#       - this filter will check if the request has a JWT token in the header
#       - if the token is valid, it will set the authentication in the security context
#       - if the token is invalid, it will throw an exception
