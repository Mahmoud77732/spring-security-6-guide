# ${varName : defaultValue}  -> environment variable
spring.application.name= ${SPRING_APP_NAME:spring-security-jwt-20}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/springsecurity_db?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.format_sql = true
spring.jpa.hibernate.show_sql = true
spring.jpa.hibernate.ddl-auto = update

spring.config.import = application_prod.properties

# default | prod
spring.profiles.active = default

server.servlet.session.timeout = ${SESSION_TIMEOUT:20m}

logging.level.org.springframework.security.web.FilterChainProxy = debug

###
# * JWT: JSON Web Token
#  - It is a token implementation which will be in the JSON format
#
# * Until now we have 2 tokens {JSESSION, XSRF-TOKEN}
# * But now we will use JWT because it is stateless and can be used in microservices because it is self-contained
#   - it is signed and can be verified by the server
#   - it is not stored in the session, so it can be used in a stateless way
#   - Used with distributed systems where quick access to user information is needed
#       without querying the database / server
#
# * JWT vs Opaque Token:
#   - Opaque Token: the server stores the token in the session and can verify it
#   - JWT: the token is self-contained, it contains all the information needed to verify
#
# * JWT Token Advantages:
#   - Statelessness
#   - Self-contained: it stores info about the user and the roles
#   - Security
#   - Expiration
#   - Reusability: can be used in different services by Single-Sign-On {SSO}
#   - Crosss-PLatform compatibility
#
# * JWT Structure:
#   - Header: contains the type of token and the signing algorithm
#       - the algorithm that is used to generate the signature
#       - e.g., {"alg": "HS256", "typ": "JWT"}
#   - Payload: contains the claims (user information, roles, etc.)
#   - Signature: used to verify the token
#       - created by signing the header and payload with a secret key
#       ! algorithm-signing( encode-header + "." + encode-payload, secret-key )
#       - e.g., HMACSHA256(base64UrlEncode(header) + "." + base64UrlEncode(payload), secret)
#
# * JWT Claims:
#   - Registered Claims: predefined claims like iss (issuer), exp (expiration), sub (subject), aud (audience)
#   - Public Claims: custom claims that can be defined by the user
#   - Private Claims: custom claims that are used only by the application
#
# * JWT Usage:
#   - Used in APIs to authenticate users
#   - Used in OAuth2 and OpenID Connect to authenticate users
#   - Used in social login to authenticate users
#   - Used in Single Sign-On (SSO) to authenticate users across different applications
#   - Used in distributed systems to authenticate users
#   - Used in microservices to authenticate users
#   - Used in social login to authenticate users
#
# * JWT Security:
#   - Use strong secret keys to sign the tokens
#   - Use HTTPS to encrypt the tokens in transit
#   - Use short expiration times for the tokens
#   - Use refresh tokens to renew the access tokens
#   - Use token revocation to invalidate the tokens
#   - Use token blacklisting to invalidate the tokens
#   - Use token whitelisting to allow only certain tokens
#   - Use token introspection to verify the tokens
#   - Use token validation to verify the tokens
#   - Use token encryption / decryption to encrypt / decrypt the tokens
#   - Use token signing / verification to sign / verify the tokens
#   - Use token serialization / deserialization to serialize / deserialize the tokens
#   - Use token compression / decompression to compress / decompress the tokens
#   - Use token encoding / decoding to encode / decode the tokens
#   - Use token hashing / unhashing to hash / unhash the tokens
#
# * https://www.jwt.io/
#
