###
# (1) DB, Schema config using {Docker + MYSQL} :
#   (1.1) docker pull mysql:latest
#   (1.2) docker run --name mysql-container -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=springsecurity_db -d -p 3307:3306 mysql:latest
#   (1.3) open workbench
#   (1.4) create connection "springsecurity_connection" + "3307"
#   (1.5) you will find your schema "springsecurity_db" is created
#
# (2) DB Structure :
#   (2.1) open "org.springframework.security.core.userdetails.jdbc"."JdbcDaoImpl" class on the IDE
#   (2.2) open it's "users.ddl" file (online, resources if found on the IDE)
#       ```SQL
#        create table `springsecurity_db`.`users`(username varchar(50) not null primary key,password varchar(1000) not null,enabled boolean not null);
#        create table `springsecurity_db`.`authorities`(username varchar(50) not null,authority varchar(50) not null,constraint fk_authorities_users foreign key(username) references users(username));
#        create unique index ix_auth_username on `springsecurity_db`.`authorities` (username,authority);
#       ```
#   (2.3) run the sql queries on workbench
#   (2.4) create "sql" folder + "scripts.sql" file on "resources" folder
#   (2.5) save the queries on "scripts.sql" file
#   (2.6) run these insert querires on workbench
#    ```SQl
#       -- passwords: User_12345@@, Admin_12345@@
#       INSERT IGNORE INTO `springsecurity_db`.`users` VALUES('user', '{noop}User_12345@@', '1');
#       INSERT IGNORE INTO `springsecurity_db`.`authorities` VALUES('user', 'read');
#       INSERT IGNORE INTO `springsecurity_db`.`users` VALUES('admin', '{bcrypt}$2a$12$UrZPFAis5fQB0fnX16Mm5OM76lXX2IjXTXX/4ZxlKiydgH1JJk6yK', '1');
#       INSERT IGNORE INTO `springsecurity_db`.`authorities` VALUES('admin', 'admin');
#    ```
# (3) add dependencies: 
#      - "JDBC API"
#      - "MYSQL Driver"
#      - "Spring Data JPA"
# (4) add DB properties
# (5) use "JdbcUserDetailsManager" instead of 'InMemoryUserDetailsManager" class
# (6) test
###

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/springsecurity_db?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.format_sql = true
spring.jpa.hibernate.show_sql = true
spring.jpa.hibernate.ddl-auto = update


