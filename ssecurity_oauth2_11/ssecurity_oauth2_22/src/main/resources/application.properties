###
#? OAUTH2 : 
#* Open Authorization -> open protocol -> built on IETF sandards & licenses from the Open Web Foundation
#
#! Scenario :-
#- How come, Google let me use the same account in all it's products? Though they are different websites / Apps?
#- Well the answer is with the help of OAuth2. OAuth2 recommend to use a separate Auth server for Authentication and Authorization
#- (1) - The PhotoEditor ask GooglePhotos to allow it making users of PhotoEditor to login with Google credentias
#      - GooglePhotos collects {details, logo, ...etc} from PhotoEditor and issued a CLIENT ID & CLIENT SECRET
#- (2) - ResourceOwner visit PhotoEditor but he has a question "so i need to share my GoogleAccount with PhotoEditor?"
#      - PhotoEditor has a button saying "Signup with Google", ResourceOwner click on it -> redirected to Google's Auth server / Google Login Page
#- (3) - ResourceOwner login as it is the login page of the Google itself
#      - Post successful authentication, Google display  asking "if he is fine to share his images data READ-ONLY scope to PhotoEditor with PhotoEditor?"
#      - he click "YES"
#- (4) - Google Authorization server issues an accessToken & refreshToken to PhotoEditor
#      - PhotoEditor stores the token for future interaction with Google servers
#- (5) - PhotoEditor sends a request to the ResourceServer of GooglePhotos along side with the accessToken
#      - GooglePhotos resourceServer validates the tokens and if valid returns the data
#- (6) - with the data recieved from GooglePhotos, PhotoEditor process the data and display it
#      - so the end user did that without sharing his secured-data with PhotoEditor
#      - Google's Resource server returns the data to PhotoEditor
#
#! Notes :-
#- OAuth2 is asecurity standard where you give one app permissions to access your data from another app
#- You authorize one app to access your data from another app or use features in another app on your behalf without giving them your password
#- You can think of the OAuth token as a "access card" at any office/hotel. these tokens provides limited access to someone, without over full control in the form of the masrwe key
#
#* OAuth2 Terminology :-
#- Resource owner: the user who owns the resource that is being accessed
#- Client: the application that is requesting access to the resource from the another app (photoeditor (client) ask google to upload a photo)
#- Authorization server: the server (Google) that authorizes the client (photoeditor)
#- Resource server: the server that provides the resource that is being accessed
#- Scopes: the permissions that the client (Photoeditor) is requesting from the authorization server (Google)
#
#* OAuth framework specifies several grant types for different user cases (you can create your own grant types)
#
#* Grant Types :-
#- Authorization Code Grant: used when you want to access a protected resource on behalf of a user
#- Client Credentials Grant: used when you want to access a protected resource on behalf of a client
#- Device Code Grant: used when you want to access a protected resource on behalf of a device
#- Refresh Token Grant: used when you want to refresh an access token
#- PKCE: used when you want to prove that your authorization request is valid
#- Implicit Grant (legacy): used when client want to access a protected resource on behalf of a user
#- Password Grant (legacy): used when client want to access a protected resource on behalf of a user
#- JWT Bearer Grant: used when you want to access a protected resource on behalf of a user
# 
#! Grant Types Flows :-
#! (1) Authorization Code Grant - Flow:-
#* This is the most common grant type
#```
#   user->>PhotoEditor: Wants to import Google Photos
#   PhotoEditor->>GoogleAuth: Redirects User through link for Authorization
#   ::PhotoEditor: Sends:- {client_ID, redirect_uri, response_type=code, scope, state}
#
#   user->>GoogleAuth: Logs in and consents
#   GoogleAuth-->>user: Redirect back with Auth Code
#
#   user->>PhotoEditor: Returns with Authorization Code
#   PhotoEditor->>GoogleAuth: Exchanges Code for Token
#  ::PhotoEditor: Sends:- {code, client_id, client_secret, redirect_uri, grant_type=authorization_code}
#
#   GoogleAuth-->>PhotoEditor: Access Token (and Refresh Token)
#   PhotoEditor->>GooglePhotos: Fetch photos with Access Token
#
#   GooglePhotos-->>PhotoEditor: Returns user's photos
#   PhotoEditor-->>user: Displays imported photos
#```
#
#! (2) Client Credentials Grant - Flow:-
#* used when you want to access a protected resource on behalf of a client "**without user interaction**
#* used in microservices - {Client, Auth Server, Resource Server}
#```
#   PhotoEditor->>GoogleAuth: Sends Token Request
#   ::PhotoEditor: Sends: {grant_type=client_credentials, client_id, client_secret, scope (optional)}
#
#   GoogleAuth-->>PhotoEditor: Returns Access Token
#
#   PhotoEditor->>GooglePhotos: Request resource with Access Token
#   GooglePhotos-->>PhotoEditor: Returns protected data
#```
#
#! (3) Device Code Grant - Flow:
#* Used for devices without a browser (e.g., Smart TVs, CLI tools)
#```
#   Device->>GoogleAuth: Sends Device Authorization Request
#   ::Device: Sends: {client_id, scope}
#
#   GoogleAuth-->>Device: Returns device_code, user_code, verification_uri
#
#   User->>GoogleAuth: On another device, opens verification_uri and enters user_code
#   User->>GoogleAuth: Logs in and consents
#
#   Device->>GoogleAuth: Polls token endpoint with device_code
#   GoogleAuth-->>Device: Returns Access Token
#```
#
#! (4) Refresh Token Grant - Flow:
#* Used to get a new access token using a long-lived refresh token
#```
#   Client->>GoogleAuth: Sends Token Request with Access Token
#   GoogleAuth-->>Client: acess token is expired - 403 forbidden error   
#
#   Client->>GoogleAuth: Sends Token Request with Refresh Token
#   ::Client: Sends: {grant_type=refresh_token, refresh_token, client_id, client_secret (if confidential), scope (optional)}
#
#   GoogleAuth-->>Client: Returns new Access Token (and optionally a new Refresh Token)
#
# * we can make our refresh-token never expire but this is not recommended (may be stolen)
# * offline_access scope is required to get a refresh token that never expires
#```
#
#! (5) PKCE - Flow:
#* Public clients (like mobile/web apps) use Proof Key for Code Exchange to prevent code interception
#```
#   User->>Client: Starts login
#   Client->>GoogleAuth: Authorization Request
#   ::Client: Sends: {code_challenge, code_challenge_method=S256, response_type=code, client_id, redirect_uri, scope, state}
#
#   User->>GoogleAuth: Logs in and consents
#   GoogleAuth-->>User: Redirect back with Authorization Code
#
#   Client->>GoogleAuth: Sends Token Request
#   ::Client: Sends: {grant_type=authorization_code, code, redirect_uri, client_id, code_verifier}
#
#   GoogleAuth-->>Client: Returns Access Token (and optionally Refresh Token)
#```
#
#! (6) Implicit Grant (legacy) - Flow:
#* Legacy method where access token is returned directly in the browser (no code exchange)
#```
#   User->>Client: Starts login
#   Client->>GoogleAuth: Sends Authorization Request
#   ::Client: Sends: {response_type=token, client_id, redirect_uri, scope, state}
#
#   User->>GoogleAuth: Logs in and consents
#   GoogleAuth-->>User: Redirect back with Access Token in URL fragment
#
#   User->>Client: Access token extracted from URL by frontend
#
#🔺 Note: Implicit Flow is now deprecated — use Authorization Code + PKCE instead.
#```
#
#! (7) Password Grant (legacy) - Flow:
#* User provides username & password directly to the client
#```
#   User->>Client: Enters username and password
#   Client->>GoogleAuth: Sends Token Request
#   ::Client: Sends: {grant_type=password, username, password, client_id, client_secret (if confidential), scope (optional)}
#
#   GoogleAuth-->>Client: Returns Access Token (and optionally Refresh Token)
#
#🔺 Note: Password Grant is considered insecure and deprecated — avoid in modern applications.
#```
# #######################################################
#
#? What is OpenID Connect?
# - OpenID Connect is a protocol that sits on top of OAuth2 framework. While OAuth2 provides authorization
#   = via an access-token containinng scopes, OpenID Connect provides authentication by introducing a new ID
#   = token (ID Token) that contains user's identity information.
# - With the ID-Token, OpenID Connect brings standards around sharing identity details among the apps
# - OpenID Connect (authentication) ->> OAuth2 (authorization) ->> HTTP
# - TheOpenID Connect flow looks the same as OAuth. The only differences are, in the intial request, a specific
#   = scope of openid is used, and in the final exchange the client recieves both an Access-Token & ID-Token
# - [ Authentication OpenID-Connect [IAM] AuthorizationOAuth2 ] ->> Identity & Access Management
# - OpenID Connect add below details to OAuth2:
#   = 1. OIDC standardizes the scopes to openid, profile, email, address
#   = 2. ID Token using JWT standard
#   = 3. OIDC exposes the standardized "/userinfo" endpoint
