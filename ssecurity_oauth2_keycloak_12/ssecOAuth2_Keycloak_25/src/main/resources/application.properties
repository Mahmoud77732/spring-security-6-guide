#
#* Implement OAuth2 server with Keycloak
#* Keycloak is an open source identity and access management solution
##
#* What Keycloak Provides:
#   - Authentication & SSO (Single Sign-On)
#   - Authorization (RBAC, ABAC)
#   - Federated Identity (e.g., login via Google, Facebook, etc.)
#   - User Management UI
#   - Multi-factor Authentication
#   - Token-based Security (OAuth2, OpenID Connect, SAML)
#   - LDAP / Active Directory integration
##
#? Why Use Keycloak Instead of Just Spring Security?
#   - Spring Security gives tools to secure an app.
#   - Keycloak is a full-fledged IAM server that handles user accounts, login flows, and tokens — out-of-the-box.
#   - Think of it as:
#       = Spring Security = Lock & key tools
#       = Keycloak = Whole building security system
##
#* 🔧 Keycloak in a Spring Boot App
#   - Run Keycloak Server (locally using Docker, or hosted)
#   - Create a realm (like a tenant or app boundary)
#   - Create a client for your Spring Boot app
#   - Configure Spring Boot to use Keycloak
##
#* Keycloak vs. Other IAM Tools :-
#
# | Tool / Service | Type                   | Self-hosted? | Protocols Supported    | Free Tier | Key Differences from Keycloak                                  |
#|----------------|------------------------|--------------|------------------------|-----------|-----------------------------------------------------------------|
#| **Keycloak**   | Open-source IAM        | ✅ Yes        | OAuth2, OIDC, SAML     | Yes       | Fully open-source and self-hosted; great for full control       |
#| **Auth0**      | Cloud IAM              | ❌ No         | OAuth2, OIDC, SAML     | Yes       | Cloud-only, easiest to use, great docs, limited free tier      |
#| **Okta**       | Cloud IAM              | ❌ No         | OAuth2, OIDC, SAML     | Yes       | Enterprise-focused, polished UI, commercial pricing tiers       |
#| **AWS Cognito**| Cloud IAM (AWS)        | ❌ No         | OAuth2, OIDC, SAML     | Yes       | Deep AWS integration, free tier, but difficult to customize     |
#| **FusionAuth** | Self-hosted or cloud   | ✅ Yes        | OAuth2, OIDC, SAML, LDAP | Yes     | Easier setup, developer-friendly, modern UI                     |
#| **ORY Hydra**  | Modular IAM stack      | ✅ Yes        | OAuth2, OIDC           | Yes       | Lightweight and modular; requires wiring additional components  |
#
#---------------------------------------------
