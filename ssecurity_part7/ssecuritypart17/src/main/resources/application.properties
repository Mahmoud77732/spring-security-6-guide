#
# * Authority (VIEWACCOUNT, VIEWBALANCE, ...ETC) 
# ! vs 
# * Role (ROLE_USER, ROLE_ADMIN, ...ETC)
#   - Authority is like individual permission
#   - Role is a collection of authorities / permissions
#   - Authority is more generic than Role
#   - Role is a type of Authority
#   - Authority can be used to define permissions, 
#   - Role is used to group authorities
#   - Authority is more flexible and can be used to define custom permissions
#   - Role is more structured and can be used to define a set of permissions
