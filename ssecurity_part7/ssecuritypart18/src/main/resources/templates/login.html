<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
</head>
<body>
    <header>
        <nav>
            <a th:href="@{/}">Home</a> |
            <a th:href="@{/contact}">Contact</a> |
            
            <!-- Show Login link when not authenticated -->
            <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
            
            <!-- Show username and logout when authenticated -->
            <span sec:authorize="isAuthenticated()">
                Welcome, <span th:text="${#authentication.name}">User</span> |
                <form th:action="@{/logout}" method="post" style="display:inline; margin-left:10px;">
                    <button type="submit" style="background:none; border:none; color:blue; text-decoration:underline; cursor:pointer; padding:0;">Logout</button>
                </form>
            </span>
        </nav>
    </header>
    <main>
        <h2>Login</h2>
        <form th:action="@{/login}" method="post">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required />
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required />
            </div>
            <div>
                <button type="submit">Login</button>
            </div>
            <div th:if="${param.error}">
                <p style="color:red;">Invalid username or password.</p>
            </div>
            <div th:if="${param.logout}">
                <p style="color:green;">You have been logged out.</p>
            </div>
        </form>
    </main>
</body>
</html>
